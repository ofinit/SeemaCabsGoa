<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" fill="none" width="100%" height="100%">
  <defs>
    <!-- Ground Shadow -->
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E1015" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#0E1015" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0E1015" stop-opacity="0" />
    </radialGradient>

    <!-- Car Body Gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEE047" />
      <stop offset="35%" stop-color="#F6C018" />
      <stop offset="85%" stop-color="#E5A708" />
      <stop offset="100%" stop-color="#C58900" />
    </linearGradient>

    <!-- Roof Gradient -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F6C018" />
    </linearGradient>

    <!-- Window Glass Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="60%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Glass Reflection -->
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Wheel Tire Gradient -->
    <radialGradient id="tireGrad" cx="50%" cy="50%" r="50%">
      <stop offset="65%" stop-color="#262626" />
      <stop offset="88%" stop-color="#171717" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </radialGradient>

    <!-- Alloy Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Taxi Sign Gradient -->
    <linearGradient id="signGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
  </defs>

  <!-- 1. Soft Ground Ambient Shadow -->
  <ellipse cx="160" cy="120" rx="130" ry="9" fill="url(#groundShadow)" />

  <!-- 2. Roof Taxi Top Sign -->
  <g id="taxi-sign">
    <!-- Base mounting pad -->
    <rect x="138" y="24" width="44" height="4" rx="2" fill="#334155" />
    <path d="M142 24 L146 16 L174 16 L178 24 Z" fill="url(#signGrad)" stroke="#D97706" stroke-width="1.2" stroke-linejoin="round" />
    <!-- Sign Inner Glow & Text -->
    <text x="160" y="22.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7" font-weight="900" fill="#B45309" text-anchor="middle" letter-spacing="1.2">TAXI</text>
  </g>

  <!-- 3. Rear Tail Light Underlay -->
  <path d="M38 68 Q34 71 36 78 L42 78 Z" fill="#DC2626" />

  <!-- 4. Main Vehicle Body Silhouette -->
  <path d="
    M38 78
    C36 73 38 67 46 65
    C58 63 68 62 82 56
    C96 46 112 30 134 26
    C158 24 196 25 212 36
    C222 43 234 54 246 59
    C256 61 270 65 278 72
    C283 76 286 82 284 88
    C282 92 278 94 274 94
    L254 94
    A 22 22 0 0 0 210 94
    L110 94
    A 22 22 0 0 0 66 94
    L44 94
    C39 94 37 88 38 78
    Z" 
    fill="url(#bodyGrad)" 
    stroke="#D97706" 
    stroke-width="1.2" 
    stroke-linejoin="round" />

  <!-- 5. Underbody Rocker Panel / Bottom Skirt -->
  <path d="M44 94 L66 94 A 22 22 0 0 1 110 94 L210 94 A 22 22 0 0 1 254 94 L274 94 L272 97 L256 97 A 24 24 0 0 0 208 97 L112 97 A 24 24 0 0 0 64 97 L42 97 Z" fill="#1E293B" />

  <!-- 6. Side Windows Area -->
  <!-- Window Frame Cutout -->
  <path d="
    M86 56
    C98 48 114 34 134 30
    C154 28 190 28 206 38
    C216 44 226 53 236 57
    C230 58 100 58 86 56
    Z" 
    fill="#0F172A" />

  <!-- Rear Quarter Window -->
  <path d="M94 54 C104 47 116 36 132 32 L132 54 Z" fill="url(#glassGrad)" />
  <path d="M94 54 C104 47 116 36 132 32 L132 54 Z" fill="url(#glassReflection)" />

  <!-- Center Cabin Windows (Front & Rear Passenger) -->
  <!-- Middle Window -->
  <path d="M136 32 L170 32 L170 54 L136 54 Z" fill="url(#glassGrad)" />
  <path d="M136 32 L170 32 L170 54 L136 54 Z" fill="url(#glassReflection)" />

  <!-- Front Windshield & Front Side Window -->
  <path d="M174 32 L202 38 C210 43 218 49 226 54 L174 54 Z" fill="url(#glassGrad)" />
  <path d="M174 32 L202 38 C210 43 218 49 226 54 L174 54 Z" fill="url(#glassReflection)" />

  <!-- B-Pillar & Window Chrome Accents -->
  <line x1="134" y1="31" x2="134" y2="55" stroke="#0F172A" stroke-width="2.5" />
  <line x1="172" y1="31" x2="172" y2="55" stroke="#0F172A" stroke-width="2.5" />
  <path d="M86 56 L238 57" stroke="#CA8A04" stroke-width="1.2" />

  <!-- 7. Body Aerodynamic Character Lines & Panels -->
  <!-- Door Shut Lines -->
  <path d="M134 56 L132 93" stroke="#CA8A04" stroke-width="1" stroke-linecap="round" opacity="0.8" />
  <path d="M176 56 L174 93" stroke="#CA8A04" stroke-width="1" stroke-linecap="round" opacity="0.8" />
  
  <!-- Sweeping Shoulder Line -->
  <path d="M46 68 Q120 68 250 69" stroke="#FEF08A" stroke-width="1.2" stroke-linecap="round" opacity="0.9" />
  <path d="M60 81 Q140 82 240 82" stroke="#CA8A04" stroke-width="0.8" stroke-linecap="round" opacity="0.6" />

  <!-- Door Handles -->
  <rect x="142" y="63" width="13" height="3" rx="1.5" fill="#334155" />
  <rect x="142" y="63" width="13" height="1.5" rx="0.75" fill="#E2E8F0" />
  <rect x="184" y="63" width="13" height="3" rx="1.5" fill="#334155" />
  <rect x="184" y="63" width="13" height="1.5" rx="0.75" fill="#E2E8F0" />

  <!-- Side Mirror -->
  <path d="M214 53 C218 51 224 51 226 54 C227 57 223 60 218 59 Z" fill="#EAB308" stroke="#CA8A04" stroke-width="0.8" />
  <path d="M216 53 L219 58" stroke="#1E293B" stroke-width="1" />

  <!-- 8. Headlights & Taillights -->
  <!-- Modern Sleek Headlight -->
  <path d="M264 68 C273 69 281 74 282 78 L265 77 Z" fill="#E0F2FE" stroke="#38BDF8" stroke-width="0.8" />
  <ellipse cx="274" cy="74" rx="3.5" ry="2" fill="#FFFFFF" />
  <line x1="267" y1="71" x2="279" y2="76" stroke="#BAE6FD" stroke-width="0.8" />

  <!-- Front Bumper Grille detail -->
  <path d="M276 83 L281 83 C282 86 280 89 278 90 L274 90 Z" fill="#1E293B" />

  <!-- Rear Wrap-around Taillight -->
  <path d="M37 70 C35 73 37 78 43 78 L43 71 Z" fill="#EF4444" stroke="#B91C1C" stroke-width="0.8" />
  <rect x="39" y="73" width="3" height="2" fill="#FCA5A5" rx="0.5" />

  <!-- 9. Front & Rear Wheel Wells (Fenders) -->
  <path d="M64 95 A 23 23 0 0 1 112 95 Z" fill="#0F172A" />
  <path d="M208 95 A 23 23 0 0 1 256 95 Z" fill="#0F172A" />

  <!-- 10. Rear Wheel Assembly -->
  <g id="rear-wheel">
    <!-- Rubber Tire -->
    <circle cx="88" cy="94" r="20" fill="url(#tireGrad)" stroke="#111827" stroke-width="1" />
    <circle cx="88" cy="94" r="16" fill="#1E293B" />
    <circle cx="88" cy="94" r="14" fill="url(#rimGrad)" />
    
    <!-- 5-Spoke Sport Alloy Rim -->
    <circle cx="88" cy="94" r="11" fill="#334155" />
    <path d="M88 83 L88 105 M77 94 L99 94 M80 86 L96 102 M80 102 L96 86" stroke="#F8FAFC" stroke-width="2.2" stroke-linecap="round" />
    <!-- Center Hub & Lug Nuts -->
    <circle cx="88" cy="94" r="4.5" fill="#0F172A" stroke="#E2E8F0" stroke-width="0.8" />
    <circle cx="88" cy="94" r="1.5" fill="#F6C018" />
  </g>

  <!-- 11. Front Wheel Assembly -->
  <g id="front-wheel">
    <!-- Rubber Tire -->
    <circle cx="232" cy="94" r="20" fill="url(#tireGrad)" stroke="#111827" stroke-width="1" />
    <circle cx="232" cy="94" r="16" fill="#1E293B" />
    <circle cx="232" cy="94" r="14" fill="url(#rimGrad)" />
    
    <!-- 5-Spoke Sport Alloy Rim -->
    <circle cx="232" cy="94" r="11" fill="#334155" />
    <path d="M232 83 L232 105 M221 94 L243 94 M224 86 L240 102 M224 102 L240 86" stroke="#F8FAFC" stroke-width="2.2" stroke-linecap="round" />
    <!-- Center Hub & Lug Nuts -->
    <circle cx="232" cy="94" r="4.5" fill="#0F172A" stroke="#E2E8F0" stroke-width="0.8" />
    <circle cx="232" cy="94" r="1.5" fill="#F6C018" />
  </g>

  <!-- Subtle Top Highlights on Fenders -->
  <path d="M68 82 C72 76 80 73 88 73 C96 73 104 76 108 82" stroke="#FEF08A" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M212 82 C216 76 224 73 232 73 C240 73 248 76 252 82" stroke="#FEF08A" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7" />
</svg>
